app:
  name: OORCA
  env: staging
  debug: false
  log_level: INFO

database:
  url: postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
  pool_size: 10
  echo: false

redis:
  url: ${REDIS_URL}

object_storage:
  endpoint: ${S3_ENDPOINT}
  access_key: ${S3_ACCESS_KEY}
  secret_key: ${S3_SECRET_KEY}
  buckets:
    raw: oorca-raw
    processed: oorca-processed

sar:
  model_path: ${SAR_MODEL_PATH}
  device: cuda
  min_area_km2: 0.05
  confidence_threshold: 0.7

ais:
  ingestion_buffer_km: 50
  interpolation_method: linear

drift:
  backend: opendrift
  default_hindcast_hours: 72
  default_forecast_hours: 96
  particle_count: 25000

attribution:
  time_window_hours: 8
  weights:
    temporal: 0.2
    spatial: 0.3
    drift: 0.4
    vessel: 0.1

liability:
  monte_carlo_iterations: 5000
  discount_rate: 0.03
[project]
name = "oorca"
version = "0.1.0"
description = "Ocean Oil Spill Response, Attribution & Compensation Analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "OORCA Contributors" }
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "opendrift>=1.11",
    "xarray>=2024.1",
    "httpx>=0.27",
    "redis>=5.0",
    "celery>=5.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "black>=24.2",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false